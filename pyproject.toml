[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drift-detector"
version = "0.1.0"
description = "Domain-classifier (C2ST) drift detector for arbitrary tabular data."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lab1702", email = "lab1702@gmail.com" }]
keywords = ["drift", "data-drift", "distribution-shift", "c2st", "monitoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
include = ["drift_detector.py"]

[tool.hatch.build.targets.sdist]
include = [
    "drift_detector.py",
    "example.py",
    "test_drift_detector.py",
    "README.md",
    "LICENSE",
]
